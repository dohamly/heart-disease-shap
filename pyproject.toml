[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML/JS templates embedded in Python strings are long by nature
"src/export_dashboard.py" = ["E501"]
"src/app_ui.py" = ["E501"]
"tests/test_dashboard_sync.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
